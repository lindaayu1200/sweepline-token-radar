<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Token Launch Radar</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>Token Launch Radar</h1>
      <p class="tagline">Ranks pre-token protocols by model-implied value from live TVL-to-market comparables.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="panel" id="model-card">
    <h2>Model card</h2>
    <div class="model-grid">
      <div>
        <h3>Formula and fit</h3>
        <p id="formula"></p>
        <p id="constants" class="muted"></p>
        <p id="loo"></p>
      </div>
      <div>
        <h3>Assumptions and verdicts</h3>
        <p id="assumption"></p>
        <p id="verdict-rule"></p>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Comparables scatter</h2>
    <div id="chart-wrap"></div>
  </section>

  <section class="panel controls-panel">
    <h2>Board controls</h2>
    <div class="controls">
      <label>Search <input id="search" type="search" placeholder="protocol or slug"></label>
      <label>Chain <select id="chain"></select></label>
      <label>Category <select id="category"></select></label>
      <label>Sort <select id="sort">
        <option value="implied">Implied value</option>
        <option value="tvl">TVL</option>
        <option value="growth">7d growth</option>
        <option value="age">Age</option>
        <option value="name">Name</option>
      </select></label>
    </div>
    <div class="chips" id="verdict-chips">
      <button data-v="all" class="chip active">All</button>
      <button data-v="farm" class="chip">Farm</button>
      <button data-v="thin" class="chip">Thin</button>
      <button data-v="skip" class="chip">Skip</button>
    </div>
  </section>

  <section class="panel table-panel">
    <h2>Board</h2>
    <div class="table-wrap">
      <table id="board">
        <thead>
          <tr>
            <th>Rank</th><th>Protocol</th><th>Chains</th><th>TVL</th><th>7d</th><th>Age</th><th>Implied</th><th>EV per active hour</th><th>Verdict</th>
          </tr>
        </thead>
        <tbody id="board-body"></tbody>
      </table>
    </div>
  </section>

  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-inner">
      <button id="drawer-close" class="close-btn" aria-label="Close">Close</button>
      <div id="drawer-content"></div>
    </div>
  </div>

  <script src="../data.js"></script>
  <script src="app.js"></script>
</body>
</html>
